<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flasher opengr8on CLU</title>
  <meta name="description" content="Instalacja i aktualizacja firmware opengr8on ESP32 CLU i jego ustawień z przeglądarki.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="top">
      <h1 data-i18n="title">Flasher opengr8on CLU</h1>
      <label class="lang"><span data-i18n="lang">Język</span>
        <select id="lang"></select>
      </label>
    </div>
    <p data-i18n="intro"></p>
    <p id="no-serial" class="warn" data-i18n="no_serial" hidden></p>
  </header>

  <section>
    <h2><span class="step">1</span> <span data-i18n="s1_title"></span></h2>
    <p data-i18n-html="s1_text"></p>
    <table class="boards">
      <thead><tr><th data-i18n="th_board"></th><th data-i18n="th_file"></th><th data-i18n="th_net"></th></tr></thead>
      <tbody>
        <tr><td>Waveshare ESP32-S3-RS485-CAN</td><td><code>waveshare</code></td><td>WiFi</td></tr>
        <tr><td>KinCony F8</td><td><code>f8</code></td><td data-i18n="net_eth"></td></tr>
        <tr><td>KinCony KC868-A8v3</td><td><code>a8v3</code></td><td data-i18n="net_eth"></td></tr>
        <tr><td>GATE HTTP (ESP32-S3)</td><td><code>opengr8on-gate-http-esp32s3-…</code></td><td>WiFi</td></tr>
      </tbody>
    </table>
    <label class="file"><span data-i18n="fw_label"></span>
      <input type="file" id="fw" accept=".bin,application/octet-stream">
    </label>
    <p id="fw-info" class="info" aria-live="polite"></p>
  </section>

  <section id="s2">
    <h2><span class="step">2</span> <span data-i18n="s2_title"></span></h2>
    <p data-i18n-html="s2_text"></p>
    <form id="cfg" autocomplete="off">
      <label class="check write-cfg"><input type="checkbox" id="write-cfg">
        <span data-i18n-html="cfg_write"></span></label>
      <p class="hint" id="cfg-keep-hint" data-i18n="cfg_keep_hint"></p>
      <p class="hint" id="cfg-ota-hint" data-i18n="cfg_ota_hint" hidden></p>
      <fieldset class="cfg-fields">
        <legend data-i18n="lg_identity"></legend>
        <label><span data-i18n="l_sn"></span> <input name="sn" inputmode="numeric" placeholder="221010155"></label>
        <label><span data-i18n="l_pin"></span> <input name="pin" maxlength="8" data-i18n-placeholder="ph_pin"></label>
      </fieldset>
      <fieldset class="cfg-fields">
        <legend><span data-i18n="lg_wifi"></span> <small data-i18n="wifi_only"></small></legend>
        <label><span data-i18n="l_ssid"></span> <input name="wifi_ssid" maxlength="32"></label>
        <label><span data-i18n="l_pass"></span> <input name="wifi_pass" type="password" maxlength="63"></label>
      </fieldset>
      <fieldset class="cfg-fields">
        <legend data-i18n="lg_mqtt"></legend>
        <label><span data-i18n="l_uri"></span> <input name="mqtt_uri" placeholder="mqtt://192.168.1.10:1883"></label>
        <label><span data-i18n="l_user"></span> <input name="mqtt_user"></label>
        <label><span data-i18n="l_pass"></span> <input name="mqtt_pass" type="password"></label>
        <label class="check"><input type="checkbox" name="mqtt_off"> <span data-i18n="mqtt_off"></span></label>
      </fieldset>
      <fieldset class="cfg-fields">
        <legend data-i18n="lg_ota"></legend>
        <label><span data-i18n="l_pass"></span> <input name="ota_pass" type="password" maxlength="64"></label>
        <p class="hint" data-i18n-html="ota_hint"></p>
      </fieldset>
      <p id="cfg-errors" class="warn" aria-live="polite"></p>
      <button type="button" id="download" data-i18n="download"></button>
      <span class="hint" data-i18n-html="download_hint"></span>
    </form>
  </section>

  <section>
    <h2><span class="step">3</span> <span data-i18n="s3_title"></span></h2>
    <fieldset class="modes">
      <label class="check"><input type="radio" name="mode" value="install" checked>
        <span data-i18n-html="m_install"></span></label>
      <label class="check"><input type="radio" name="mode" value="update">
        <span data-i18n-html="m_update"></span></label>
      <label class="check"><input type="radio" name="mode" value="settings">
        <span data-i18n-html="m_settings"></span></label>
      <label class="check"><input type="radio" name="mode" value="ota">
        <span><span data-i18n-html="m_ota"></span>
          <small id="ota-mode-hint" data-i18n="ota_mode_off" hidden></small></span></label>
    </fieldset>
    <fieldset id="ota-net" hidden>
      <legend data-i18n="lg_ota_net"></legend>
      <label><span data-i18n="l_clu_addr"></span>
        <input id="ota-host" placeholder="192.168.1.50" autocomplete="off" spellcheck="false"></label>
      <label><span data-i18n="l_ota_pass"></span>
        <input id="ota-pw" type="password" maxlength="64" autocomplete="off"></label>
      <p class="hint" data-i18n-html="ota_net_hint"></p>
    </fieldset>
    <p class="hint" id="boot-hint" data-i18n="boot_hint"></p>
    <div class="actions">
      <button type="button" id="flash" class="primary" data-i18n="flash_btn"></button>
      <button type="button" id="mon-open" data-i18n="mon_open"></button>
    </div>
    <progress id="progress" max="1" value="0" hidden></progress>
    <pre id="log" aria-live="polite"></pre>
    <div id="ota-fallback" class="ota-fallback" hidden>
      <p class="warn" data-i18n="ota_blocked"></p>
      <div class="actions">
        <a id="ota-open" class="button primary" target="_blank" rel="noopener" data-i18n="ota_open"></a>
        <a id="ota-save" class="button" download="opengr8on_clu_esp32.bin" data-i18n="ota_save_app"></a>
      </div>
    </div>
    <div id="mon" hidden>
      <div class="mon-bar">
        <strong data-i18n="mon_title"></strong>
        <span id="mon-state" class="hint"></span>
        <span class="mon-tools">
          <button type="button" id="mon-reset" data-i18n="mon_reset"></button>
          <button type="button" id="mon-clear" data-i18n="mon_clear"></button>
          <button type="button" id="mon-save" data-i18n="mon_save"></button>
          <button type="button" id="mon-stop" data-i18n="mon_stop"></button>
        </span>
      </div>
      <pre id="mon-log"></pre>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
